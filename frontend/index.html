<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ff5000" />

  <title>校园集市 CampusBazaar · 同校二手交易</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff5000'/%3E%3Cpath d='M20 24h24l-2 20H22z' fill='%23fff'/%3E%3Cpath d='M26 24a6 6 0 0 1 12 0' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
  <style>
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f6f8; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    #boot .dot { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #ff7a45, #ff5000); animation: pulse 1.1s ease-in-out infinite; }

  </style>
</head>
<body>
